apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
  namespace: ege-generator
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: ege-api:latest
          command: ["sh", "-c", "cd backend && alembic upgrade head"]
          envFrom:
            - configMapRef:
                name: ege-config
            - secretRef:
                name: ege-secrets
          env:
            - name: DATABASE_URL
              value: postgresql+asyncpg://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/$(POSTGRES_DB)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: ege-generator
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: api
          image: ege-api:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: ege-config
            - secretRef:
                name: ege-secrets
          env:
            - name: DATABASE_URL
              value: postgresql+asyncpg://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/$(POSTGRES_DB)
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: ege-generator
spec:
  selector:
    app: api
  ports:
    - port: 8000
      targetPort: 8000
