apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backup-pvc
  namespace: ege-generator
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  namespace: ege-generator
spec:
  schedule: "0 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: backup
              image: postgres:15
              command:
                - sh
                - -c
                - |
                  FILENAME="/backups/${POSTGRES_DB}_$(date +%Y%m%d_%H%M%S).dump"
                  echo "Запуск pg_dump -> $FILENAME"
                  pg_dump -h postgres -U "$POSTGRES_USER" -Fc -f "$FILENAME" "$POSTGRES_DB"
                  echo "Удаление бэкапов старше 7 дней"
                  find /backups -name "*.dump" -mtime +7 -delete
                  echo "Готово"
              env:
                - name: POSTGRES_USER
                  valueFrom:
                    secretKeyRef:
                      name: ege-secrets
                      key: POSTGRES_USER
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: ege-secrets
                      key: POSTGRES_PASSWORD
                - name: POSTGRES_DB
                  valueFrom:
                    configMapKeyRef:
                      name: ege-config
                      key: POSTGRES_DB
              volumeMounts:
                - name: backups
                  mountPath: /backups
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 300m
                  memory: 256Mi
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: backup-pvc
